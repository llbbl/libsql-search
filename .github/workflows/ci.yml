name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run type check
        run: pnpm build

      - name: Run tests
        run: pnpm test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build library
        run: pnpm build

      - name: Check build artifacts
        run: |
          test -f dist/index.cjs || exit 1
          test -f dist/index.esm.js || exit 1
          test -f dist/index.d.ts || exit 1

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run security audit
        run: pnpm audit --audit-level moderate

      - name: Run dependency review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          # Temporary Xenova audit baseline for GH #21.
          # Remove when @xenova/transformers is replaced.
          allow-ghsas: >-
            GHSA-xq3m-2v4x-88gg,
            GHSA-66ff-xgx4-vchm,
            GHSA-2pr8-phx7-x9h3,
            GHSA-fx83-v9x8-x52w,
            GHSA-75px-5xx7-5xc7,
            GHSA-jvwf-75h9-cwgg,
            GHSA-685m-2w69-288q,
            GHSA-q6x5-8v7m-xcrf,
            GHSA-jggg-4jg4-v7c6,
            GHSA-wcpc-wj8m-hjx6,
            GHSA-f38q-mgvj-vph7,
            GHSA-f88m-g3jw-g9cj
