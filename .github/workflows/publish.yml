name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify release commit is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Release commit ${GITHUB_SHA} is not an ancestor of origin/main; aborting."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag and manifests
        id: release-version
        run: |
          version=$(node ./scripts/validate-release-version.mjs "${GITHUB_REF_NAME}")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Validated release version ${version}"

      - name: Run release validation
        run: pnpm validate:release

  publish-npm:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Verify release tag still points to this commit
        run: |
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_target=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")

          if [ "${tag_target}" != "${GITHUB_SHA}" ]; then
            echo "Remote tag ${GITHUB_REF_NAME} resolves to ${tag_target}, not ${GITHUB_SHA}; aborting publish."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm validate:package

      - name: Publish to npm
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          published_version=$(pnpm view "libsql-search@${VERSION}" version 2>/dev/null || true)

          if [ "${published_version}" = "${VERSION}" ]; then
            echo "libsql-search@${VERSION} is already published on npm; skipping OIDC publish."
            exit 0
          fi

          echo "Publishing libsql-search@${VERSION} to npm with trusted publishing OIDC."
          pnpm dlx npm@12.0.2 publish --access public --ignore-scripts

  publish-jsr:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Verify release tag still points to this commit
        run: |
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_target=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")

          if [ "${tag_target}" != "${GITHUB_SHA}" ]; then
            echo "Remote tag ${GITHUB_REF_NAME} resolves to ${tag_target}, not ${GITHUB_SHA}; aborting publish."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to JSR
        run: pnpm dlx jsr@0.14.3 publish

  release:
    needs:
      - validate
      - publish-npm
      - publish-jsr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Verify release tag still points to this commit
        run: |
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_target=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")

          if [ "${tag_target}" != "${GITHUB_SHA}" ]; then
            echo "Remote tag ${GITHUB_REF_NAME} resolves to ${tag_target}, not ${GITHUB_SHA}; aborting release notes."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          tag="v${VERSION}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists; skipping create."
            exit 0
          fi

          gh release create "${tag}" --verify-tag --generate-notes --title "${tag}"
