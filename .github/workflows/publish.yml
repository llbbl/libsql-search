name: Publish Package

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  check-version-change:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version-changed: ${{ steps.check.outputs.changed }}
      current-version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Check if version changed
        id: check
        run: |
          current_version=$(node -p "require('./package.json').version")
          echo "version=${current_version}" >> "$GITHUB_OUTPUT"

          # Check if package.json version changed in this commit
          if git diff HEAD~1 HEAD --name-only | grep -q "package.json"; then
            prev_version=$(git show HEAD~1:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin')).version")
            if [ "$current_version" != "$prev_version" ]; then
              echo "Version changed from $prev_version to $current_version"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "Package.json changed but version stayed the same"
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Package.json not changed in this commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check-version-change
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      needs.check-version-change.outputs.version-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release validation
        run: pnpm validate:release

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to JSR
        run: pnpx jsr publish
