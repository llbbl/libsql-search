name: Publish Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to recover, for example v0.1.4'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      should_release: ${{ steps.auto-plan.outputs.should_release || steps.tag-release.outputs.should_release }}
      version: ${{ steps.auto-plan.outputs.version || steps.tag-release.outputs.version }}
      tag: ${{ steps.auto-plan.outputs.tag || steps.tag-release.outputs.tag }}
      release_sha: ${{ steps.tag-release.outputs.release_sha || github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Determine release mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "${REF_TYPE}" = "tag" ]; then
            echo "mode=manual" >> "$GITHUB_OUTPUT"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "mode=dispatch" >> "$GITHUB_OUTPUT"
          else
            echo "mode=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan automatic release
        id: auto-plan
        if: steps.mode.outputs.mode == 'auto'
        run: node ./scripts/plan-release.mjs --github-output

      - name: Validate selected tag release
        id: tag-release
        if: steps.mode.outputs.mode == 'manual' || steps.mode.outputs.mode == 'dispatch'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          REQUESTED_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ "${MODE}" = "manual" ]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="${REQUESTED_RELEASE_TAG}"
          fi

          if ! echo "${release_tag}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Release tag ${release_tag} must match vX.Y.Z with SemVer numeric identifiers."
            exit 1
          fi

          git fetch --no-tags origin "main:refs/remotes/origin/main"
          git fetch --force --no-tags origin "refs/tags/${release_tag}:refs/tags/${release_tag}"

          tag_target=$(git rev-parse "${release_tag}^{commit}")
          event_target=$(git rev-parse "${GITHUB_SHA}^{commit}")

          if [ "${MODE}" = "manual" ] && [ "${tag_target}" != "${event_target}" ]; then
            echo "Tag ${release_tag} resolves to ${tag_target}, not event commit ${event_target}; aborting."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${tag_target}" "origin/main"; then
            echo "Release commit ${tag_target} is not an ancestor of origin/main; aborting."
            exit 1
          fi

          git switch --detach "${tag_target}"
          version=$(node ./scripts/validate-release-version.mjs "${release_tag}")
          {
            echo "should_release=true"
            echo "version=${version}"
            echo "tag=${release_tag}"
            echo "release_sha=${tag_target}"
          } >> "$GITHUB_OUTPUT"
          echo "Validated ${MODE} release ${release_tag} at ${tag_target}."

      - name: Setup pnpm for selected tag validation
        if: steps.mode.outputs.mode == 'manual' || steps.mode.outputs.mode == 'dispatch'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5

      - name: Setup Deno for selected tag validation
        if: steps.mode.outputs.mode == 'manual' || steps.mode.outputs.mode == 'dispatch'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install dependencies for selected tag validation
        if: steps.mode.outputs.mode == 'manual' || steps.mode.outputs.mode == 'dispatch'
        run: pnpm install --frozen-lockfile

      - name: Run selected tag release validation
        if: steps.mode.outputs.mode == 'manual' || steps.mode.outputs.mode == 'dispatch'
        run: pnpm validate:release

  prepare-release:
    name: Prepare Automatic Release
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: needs.plan.outputs.mode == 'auto' && needs.plan.outputs.should_release == 'true'
    permissions:
      contents: write
    concurrency:
      group: release-writer-main
      cancel-in-progress: false
    outputs:
      should_publish: ${{ steps.push-release.outputs.should_publish || 'false' }}
      version: ${{ steps.release-plan.outputs.version }}
      tag: ${{ steps.release-plan.outputs.tag }}
      release_sha: ${{ steps.push-release.outputs.release_sha }}

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fetch fresh main and tags
        id: fresh-main
        run: |
          git fetch --force origin "main:refs/remotes/origin/main"
          git fetch --force --tags origin

          main_sha=$(git rev-parse "refs/remotes/origin/main")
          if [ "${main_sha}" != "${GITHUB_SHA}" ]; then
            echo "origin/main is now ${main_sha}, not this run's ${GITHUB_SHA}; a newer run should release the accumulated main state."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch --detach "${main_sha}"
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.fresh-main.outputs.current == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5

      - name: Setup Node.js
        if: steps.fresh-main.outputs.current == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Setup Deno
        if: steps.fresh-main.outputs.current == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        if: steps.fresh-main.outputs.current == 'true'
        run: pnpm install --frozen-lockfile

      - name: Recompute release plan and sync manifests
        id: release-plan
        if: steps.fresh-main.outputs.current == 'true'
        run: node ./scripts/plan-release.mjs --write --github-output

      - name: Check remote tag availability
        id: remote-tag
        if: steps.release-plan.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.release-plan.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Remote tag ${TAG} already exists; skipping automatic publish."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Validate release candidate
        if: steps.remote-tag.outputs.available == 'true'
        env:
          TAG: ${{ steps.release-plan.outputs.tag }}
        run: |
          node ./scripts/validate-release-version.mjs "${TAG}"
          pnpm validate:release

      - name: Commit, tag, and push release
        id: push-release
        if: steps.remote-tag.outputs.available == 'true'
        env:
          TAG: ${{ steps.release-plan.outputs.tag }}
          VERSION: ${{ steps.release-plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- ./package.json ./jsr.json ./deno.json; then
            git add ./package.json ./jsr.json ./deno.json
            git commit -m "chore(release): v${VERSION} [skip release]"
          else
            echo "Manifests already match v${VERSION}; tagging the current main commit."
          fi

          git tag -a "${TAG}" -m "Release ${TAG}"

          remote_main=$(git ls-remote origin "refs/heads/main" | cut -f1)
          if [ "${remote_main}" != "${GITHUB_SHA}" ]; then
            echo "origin/main moved to ${remote_main} before push; a newer run should release."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/${TAG}:refs/tags/${TAG}"
          release_sha=$(git rev-parse HEAD)
          {
            echo "release_sha=${release_sha}"
            echo "should_publish=true"
          } >> "$GITHUB_OUTPUT"

  publish-npm:
    name: Publish npm
    needs:
      - plan
      - prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.mode == 'manual' || needs.plan.outputs.mode == 'dispatch' || needs.prepare-release.outputs.should_publish == 'true')
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag || needs.plan.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha || needs.plan.outputs.release_sha }}
      VERSION: ${{ needs.prepare-release.outputs.version || needs.plan.outputs.version }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm validate:package

      - name: Publish to npm
        run: |
          published_version=$(pnpm view "libsql-search@${VERSION}" version 2>/dev/null || true)
          if [ "${published_version}" = "${VERSION}" ]; then
            echo "libsql-search@${VERSION} is already published on npm; skipping OIDC publish."
            exit 0
          fi

          node ./scripts/validate-release-version.mjs "${RELEASE_TAG}"
          git fetch --force --no-tags origin "main:refs/remotes/origin/main"
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_target=$(git rev-parse "${RELEASE_TAG}^{commit}")
          checkout_sha=$(git rev-parse HEAD)

          if [ "${tag_target}" != "${checkout_sha}" ]; then
            echo "Remote tag ${RELEASE_TAG} resolves to ${tag_target}, not checked out commit ${checkout_sha}; aborting npm publish."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${checkout_sha}" "origin/main"; then
            echo "Release commit ${checkout_sha} is no longer an ancestor of origin/main; aborting npm publish."
            exit 1
          fi

          echo "Publishing libsql-search@${VERSION} to npm with trusted publishing OIDC."
          pnpm dlx npm@12.0.2 publish --provenance --access public --ignore-scripts

  publish-jsr:
    name: Publish JSR
    needs:
      - plan
      - prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.mode == 'manual' || needs.plan.outputs.mode == 'dispatch' || needs.prepare-release.outputs.should_publish == 'true')
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag || needs.plan.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha || needs.plan.outputs.release_sha }}
      VERSION: ${{ needs.prepare-release.outputs.version || needs.plan.outputs.version }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to JSR
        run: |
          node ./scripts/validate-release-version.mjs "${RELEASE_TAG}"
          git fetch --force --no-tags origin "main:refs/remotes/origin/main"
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_target=$(git rev-parse "${RELEASE_TAG}^{commit}")
          checkout_sha=$(git rev-parse HEAD)

          if [ "${tag_target}" != "${checkout_sha}" ]; then
            echo "Remote tag ${RELEASE_TAG} resolves to ${tag_target}, not checked out commit ${checkout_sha}; aborting JSR publish."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${checkout_sha}" "origin/main"; then
            echo "Release commit ${checkout_sha} is no longer an ancestor of origin/main; aborting JSR publish."
            exit 1
          fi

          echo "Publishing @logan/libsql-search@${VERSION} to JSR with OIDC."
          pnpm dlx jsr@0.14.3 publish

  release:
    name: Create GitHub Release
    needs:
      - plan
      - prepare-release
      - publish-npm
      - publish-jsr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always() && needs.publish-npm.result == 'success' && needs.publish-jsr.result == 'success'
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag || needs.plan.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha || needs.plan.outputs.release_sha }}
      VERSION: ${{ needs.prepare-release.outputs.version || needs.plan.outputs.version }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify release tag
        run: |
          git fetch --force --no-tags origin "main:refs/remotes/origin/main"
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_target=$(git rev-parse "${RELEASE_TAG}^{commit}")
          checkout_sha=$(git rev-parse HEAD)

          if [ "${tag_target}" != "${checkout_sha}" ]; then
            echo "Remote tag ${RELEASE_TAG} resolves to ${tag_target}, not checked out commit ${checkout_sha}; aborting release notes."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${checkout_sha}" "origin/main"; then
            echo "Release commit ${checkout_sha} is no longer an ancestor of origin/main; aborting release notes."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists; skipping create."
            exit 0
          fi

          gh release create "${RELEASE_TAG}" --verify-tag --generate-notes --title "${RELEASE_TAG}"
